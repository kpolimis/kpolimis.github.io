name: Publish Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install matplotlib seaborn ipykernel jupyter-cache nbstripout

      - name: Register blog kernel
        run: python -m ipykernel install --user --name blog --display-name "blog"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -v

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b  # v2

      - name: Render site
        run: quarto render

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Assemble public source tree
        run: |
          mkdir -p _public_src
          # Manifest-driven export: only tracked files matching these patterns.
          # Fail-closed: new files are excluded by default unless added here.
          git ls-files \
            -- '*.qmd' \
               '_quarto.yml' 'custom.scss' 'styles.css' \
               'bayesian-waves-bg.js' 'include-script.html' \
               'requirements.txt' 'LICENSE' \
               'images/**' 'technical_files/**' \
               'posts/**/*.qmd' 'posts/**/*.py' 'posts/**/*.ipynb' \
               'posts/**/data/**' 'posts/**/*.png' 'posts/**/*.gif' \
               'posts/**/*.jpg' 'posts/**/*.svg' 'posts/**/*.csv' \
               'downloads/**' \
            | while IFS= read -r f; do
                mkdir -p "_public_src/$(dirname "$f")"
                cp "$f" "_public_src/$f"
              done
          # Strip notebook outputs before publishing
          find _public_src -name '*.ipynb' -exec nbstripout {} \;
          # Belt-and-suspenders: remove any .md files that slipped through
          find _public_src -name '*.md' -delete
          # README for the public mirror
          printf '# Blog source mirror\n\nSource files for [kivanpolimis.com](https://kivanpolimis.com) — QMDs, notebooks, and code for reproducibility.\n\nBuilt site at the link above. Do not open PRs here.\n' > _public_src/README.md

      - name: Sync source to public main
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: public-src
          publish_dir: ./_public_src
          force_orphan: true
          full_commit_message: "sync: blog-source@${{ github.sha }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
