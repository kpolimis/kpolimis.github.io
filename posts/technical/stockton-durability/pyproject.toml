# Standalone pyproject.toml for stockton-durability extraction.
# Used when running tools directly from this directory (e.g. during extraction
# to its own repo). The parent blog repo's pyproject.toml governs CI.

[project]
name = "stockton-durability"
version = "0.1.0"
requires-python = ">=3.10"
description = "NBA durability analysis pipeline — Stockton / Diaw / population study"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90", "UP", "B", "D"]
ignore = [
    "D100",   # missing module docstring
    "D104",   # missing public package docstring
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "E501",   # handled by formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
